[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-shmaudio"
version = "0.1.0"
description = "Agent skill for procedural foley, stereo scene synthesis, and iterative spectrogram-guided SFX design."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.1",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["skills/audio-shmaudio/scripts"]
testpaths = ["tests"]
